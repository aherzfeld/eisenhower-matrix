name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 7

  # Deploys only from main, and only after every check above passed, so the
  # build that goes live is the one that was tested.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: eisenhower-matrix
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Ensure the Pages project exists (no-op after the first run)
        run: npx --yes wrangler@3.114.17 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy dist/ to Cloudflare Pages
        run: npx --yes wrangler@3.114.17 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"
